<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Structured report</title>
<style>
:root{
  --paper:#ECEEE9; --panel:#F8F9F6; --panel-2:#F1F3EF;
  --ink:#17262B; --ink-2:#4A5A60; --ink-3:#77878C;
  --rule:#C9D0CA; --dot:#C3CBC5;
  --marker:#F5D547; --marker-soft:#FBEFB0;
  --cobalt:#2D4FD6;
  --ok:#2F7A57; --warn:#A8761A; --bad:#B8432F; --idle:#77878C;
  --display:"Avenir Next Condensed","Avenir Next","Segoe UI Variable Display","Bahnschrift","Helvetica Neue",system-ui,sans-serif;
  --text:"Avenir Next","Segoe UI Variable Text","Segoe UI","Helvetica Neue",system-ui,sans-serif;
  --r-node:10px; --r-small:6px;
}
*{box-sizing:border-box}
html{background:var(--paper);color:var(--ink);font:15px/1.55 var(--text);font-feature-settings:"tnum" 1,"lnum" 1;-webkit-font-smoothing:antialiased}
body{margin:0;overflow-x:hidden}
.top > *,.map-wrap{min-width:0}
a{color:var(--cobalt);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
code{font:13px/1.4 ui-monospace,"SF Mono",Menlo,monospace;background:var(--panel-2);border:1px solid var(--rule);border-radius:4px;padding:0 4px}
.icon{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.sm{width:15px;height:15px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── header ─────────────────────────────────────────── */
.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,380px);gap:40px;padding:44px clamp(20px,5vw,64px) 28px;align-items:start}
.top h1{font:600 clamp(30px,4vw,46px)/1.05 var(--display);letter-spacing:-.01em;margin:0 0 14px;max-width:22ch}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--ink-2);font-size:14px;margin:0 0 18px}
.meta span{display:inline-flex;gap:6px;align-items:center}
.summary{max-width:68ch;margin:0;font-size:16px}
.tally{display:flex;gap:22px;margin-top:22px;flex-wrap:wrap}
.tally div{display:flex;flex-direction:column}
.tally b{font:600 28px/1 var(--display)}
.tally span{color:var(--ink-2);font-size:13px}

.queue{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-node);padding:18px 18px 8px}
.queue h2{font:600 19px/1.2 var(--display);margin:0 0 4px;display:flex;gap:8px;align-items:center}
.queue p.hint{margin:0 0 12px;color:var(--ink-2);font-size:13px}
.queue ul{list-style:none;margin:0;padding:0}
.queue li{border-top:1px solid var(--rule)}
.queue button{all:unset;display:grid;grid-template-columns:20px 1fr;gap:10px;padding:10px 2px;cursor:pointer;width:100%}
.queue button:hover .q-text{background:linear-gradient(transparent 55%,var(--marker-soft) 55%)}
.queue button:focus-visible{outline:2px solid var(--cobalt)}
.q-text{font-size:14px}
.q-task{display:block;color:var(--ink-3);font-size:12.5px}
.queue .empty{color:var(--ink-2);font-size:14px;padding:10px 0}

/* ── map ────────────────────────────────────────────── */
.map-wrap{margin:8px clamp(12px,3vw,40px) 0;border-top:1px solid var(--rule)}
.map-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px clamp(8px,2vw,24px) 8px;flex-wrap:wrap}
.map-head h2{font:600 22px/1.2 var(--display);margin:0}
.legend{display:flex;gap:18px;color:var(--ink-2);font-size:13px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend > span > svg{width:34px;height:10px}
.map{overflow:auto;padding:24px clamp(8px,2vw,24px) 48px;
  background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:18px 18px}
.graph{position:relative;margin:0 auto}
.graph > svg{position:absolute;inset:0;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.edge.related{stroke-dasharray:5 5;stroke:var(--ink-3)}
.edge.blocks{stroke:var(--bad)}
.edge-label{font:12px var(--text);fill:var(--ink-2);paint-order:stroke;stroke:var(--paper);stroke-width:5px}

.node{position:absolute;text-align:left;font:inherit;color:inherit;cursor:pointer;
  background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-node);padding:14px 16px 12px;width:260px;
  box-shadow:0 1px 0 var(--rule);transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
.node:hover{transform:translateY(-2px);border-color:var(--ink-3);box-shadow:0 6px 18px -10px rgba(23,38,43,.45)}
.node[aria-current="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.node .st{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
.node h3{font:600 18px/1.2 var(--display);margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.node .goal{font-size:13px;color:var(--ink-2);margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node .flags{display:flex;gap:6px;flex-wrap:wrap}
.flag{display:inline-flex;align-items:center;gap:5px;font-size:12px;border-radius:999px;padding:2px 9px 2px 7px;background:var(--panel-2);border:1px solid var(--rule);color:var(--ink-2)}
.flag.mine{background:var(--marker);border-color:#D9B92A;color:var(--ink)}

.s-done{color:var(--ok)} .s-in_progress{color:var(--warn)} .s-blocked,.s-failed{color:var(--bad)}
.s-needs_review{color:var(--cobalt)} .s-planned,.s-skipped{color:var(--idle)} .s-partial{color:var(--warn)}

/* ── drawer ─────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(23,38,43,.28);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(860px,100%);background:var(--paper);border-left:1px solid var(--rule);
  transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.7,.2,1);overflow:auto;box-shadow:-20px 0 40px -30px rgba(23,38,43,.6)}
.drawer.open{transform:none}
.drawer:focus{outline:none}
.d-head{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--rule);padding:18px 28px 14px;display:grid;grid-template-columns:1fr auto;gap:12px}
.d-head h2{font:600 28px/1.1 var(--display);margin:4px 0 6px}
.d-head .st{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.iconbtn{all:unset;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--rule);background:var(--panel)}
.iconbtn:hover{border-color:var(--ink-3)}
.iconbtn:focus-visible{outline:2px solid var(--cobalt)}
.d-nav{display:flex;gap:6px}
.d-body{padding:8px 28px 64px}

.sec{padding:22px 0 6px;border-bottom:1px solid var(--rule)}
.sec:last-child{border-bottom:0}
.sec > h3{display:flex;gap:10px;align-items:center;font:600 20px/1.2 var(--display);margin:0 0 12px}
.sec > h3 .count{font:500 13px var(--text);color:var(--ink-3)}
.sec > p,.sec .prose{max-width:72ch;margin:0 0 12px}
.lead{font-size:16.5px}

.kind-legend{display:flex;gap:20px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin:-4px 0 14px}
.kind-legend span{display:inline-flex;gap:8px;align-items:center}
.kind-legend i{display:inline-block;width:3px;height:16px}
.k-evidence{border-left:3px solid var(--ink)}
.k-inference{border-left:4px double var(--ink)}
.k-assumption{border-left:3px dashed var(--ink-3)}
.kind-legend i.k-evidence,.kind-legend i.k-inference,.kind-legend i.k-assumption{width:0}

.ctx{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.ctx li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:8px 12px;background:var(--panel);border-radius:var(--r-small)}
.ctx li:target{background:var(--marker-soft)}
.ctx .t{font-weight:600}
.ctx .n{color:var(--ink-2);font-size:14px}
.ctx .id{color:var(--ink-3);font-size:12px;margin-left:6px}

.claims{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:10px}
.claims li{padding:6px 0 6px 14px;max-width:76ch}
.claims .sub{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink-2);font-size:13px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;padding:0 7px;border-radius:999px;border:1px solid var(--rule);background:var(--panel);color:var(--ink-2);text-decoration:none}
a.chip:hover{border-color:var(--cobalt);color:var(--cobalt)}
.conf{display:inline-flex;gap:3px;align-items:center}
.conf i{width:6px;height:6px;border-radius:50%;border:1px solid var(--ink-2)}
.conf i.on{background:var(--ink-2)}

.result-sum{font-size:16.5px;max-width:70ch;margin:0 0 14px}
.result{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:2px}
.result li{display:grid;grid-template-columns:22px 110px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--rule);align-items:start}
.result li:first-child{border-top:0}
.result .k{color:var(--ink-2);font-size:13px;padding-top:1px}
.metric{display:inline-flex;gap:8px;align-items:baseline}
.metric b{font:600 18px var(--display)}

.flow{overflow:auto;padding:16px 6px 20px;margin:0 -6px 8px;background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:16px 16px;border-radius:var(--r-small)}
.stage{position:absolute;background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-node);padding:10px 12px;width:300px}
.stage .h{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start}
.stage .num{font:600 13px/1 var(--display);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--panel)}
.stage h4{font:600 16px/1.25 var(--display);margin:2px 0 0}
.stage .d{font-size:13.5px;margin:8px 0 0}
.stage .o{font-size:13px;margin:8px 0 0;padding-top:8px;border-top:1px solid var(--rule);display:flex;gap:6px;color:var(--ink-2)}
.stage .o .icon{margin-top:2px}
.stage .refs{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.stage.st-failed{border-color:var(--bad)} .stage.st-skipped,.stage.st-planned{border-style:dashed} .stage.st-skipped{opacity:.65}
.stage.st-partial,.stage.st-in_progress{border-color:var(--warn)}

.mine-list{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:10px}
.mine-list li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:12px 14px;border-radius:var(--r-small);background:var(--panel);border-left:5px solid var(--marker)}
.mine-list .t{font-weight:600}
.mine-list .why{color:var(--ink-2);font-size:14px;margin-top:2px}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.opts span{font-size:13px;border:1px solid var(--rule);border-radius:999px;padding:1px 10px;background:var(--paper)}
.cmd{display:flex;align-items:center;gap:8px;margin-top:8px}
.cmd code{flex:1;display:block;padding:6px 8px;overflow:auto;white-space:pre}
.copy{all:unset;cursor:pointer;font-size:12.5px;color:var(--cobalt);display:inline-flex;gap:4px;align-items:center}
.copy:focus-visible{outline:2px solid var(--cobalt)}
.none{color:var(--ink-3);font-size:14px;margin:0 0 12px}

footer{padding:24px clamp(20px,5vw,64px) 40px;color:var(--ink-3);font-size:13px;border-top:1px solid var(--rule);margin-top:24px}

#print-all{display:none}
@media (max-width:820px){
  .top{grid-template-columns:minmax(0,1fr);gap:24px}
  .legend{gap:10px 14px}
  .d-head,.d-body{padding-left:18px;padding-right:18px}
  .result li{grid-template-columns:22px 1fr}.result .k{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  html{background:#fff;font-size:12px}
  .queue button{cursor:auto}
  .map,.map-wrap,.drawer,.scrim,.no-print{display:none!important}
  #print-all{display:block}
  #print-all .task-print{break-before:page;padding:0 0 12px}
  #print-all .d-head{position:static;padding:0 0 10px}
  #print-all .d-body{padding:0}
  .sec{break-inside:avoid-page}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">

      <path d="M1 1 9 5 1 9" fill="none" stroke="#B8432F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- status -->

  <symbol id="i-problem" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19z"/><path d="M12 10v4.5M12 17.2v.1"/></symbol>

  <symbol id="i-result" viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="m8.5 12 2.3 2.3L15.5 9.5"/></symbol>
  <symbol id="i-flow" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="5" rx="1.2"/><rect x="14" y="16" width="7" height="5" rx="1.2"/><rect x="14" y="3" width="7" height="5" rx="1.2"/><path d="M10 5.5h4M17.5 8v8"/></symbol>
  <symbol id="i-approve" viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M6.5 15.5 15 7l2.5 2.5L9 18H6.5z"/><path d="m13.5 8.5 2.5 2.5"/></symbol>
  <symbol id="i-action" viewBox="0 0 24 24"><path d="M9 11.5V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0v4c0 3.5-2.5 6-6 6h-1c-2 0-3.2-.8-4.5-2.4L4.3 15a1.5 1.5 0 0 1 2.4-1.8L9 15.5"/></symbol>
  <symbol id="i-queue" viewBox="0 0 24 24"><path d="M4 6h11M4 12h11M4 18h7"/><path d="m16 17 2 2 3.5-4"/></symbol>
  <!-- context kinds -->
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></symbol>
  <symbol id="i-url" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z"/><path d="M8.5 11h7M8.5 14h7M8.5 17h4"/></symbol>
  <symbol id="i-log" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="m7 9 3 3-3 3M12.5 15H17"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
  <symbol id="i-data" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="2.8"/><path d="M5 6v12c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8V6M5 12c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8"/></symbol>
  <symbol id="i-commit" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M2.5 12h6M15.5 12h6"/></symbol>
  <symbol id="i-issue" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2" fill="currentColor"/></symbol>
  <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M13.5 5l-3 14"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-9 8"/></symbol>
  <!-- result kinds -->
  <symbol id="i-added" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 8v8M8 12h8"/></symbol>
  <symbol id="i-changed" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
  <symbol id="i-removed" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12h8"/></symbol>
  <symbol id="i-fixed" viewBox="0 0 24 24"><path d="M14.5 6.5a4 4 0 0 0-5.3 5.3L4 17v3h3l5.2-5.2a4 4 0 0 0 5.3-5.3L15 12l-3-3z"/></symbol>
  <symbol id="i-verified" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6z"/><path d="m9 12 2.2 2.2L15.5 10"/></symbol>
  <symbol id="i-metric" viewBox="0 0 24 24"><path d="M4 20V4M4 20h16"/><path d="m7 15 4-4 3 3 5-6"/></symbol>
  <symbol id="i-decision" viewBox="0 0 24 24"><path d="M12 3v6M12 9l-6 6M12 9l6 6"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/></symbol>
  <!-- ui -->
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="1.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
  <symbol id="i-author" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1-4 4-5.5 7-5.5s6 1.5 7 5.5"/></symbol>
  <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3.5h10V9M7 17H4.5V9h15v8H17"/><rect x="7" y="14" width="10" height="6.5"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="1.5"/><path d="M16 8V4H4v12h4"/></symbol>
  <symbol id="i-outcome" viewBox="0 0 24 24"><path d="M5 12h12M13 7l5 5-5 5"/></symbol>
</svg>

<header class="top">
  <div>
    <h1 id="title"></h1>
    <p class="meta" id="meta"></p>
    <p class="summary" id="summary"></p>

// ── layered graph layout (Sugiyama-lite) ──────────────
// nodes: [{id,w,h}], edges: [{from,to,kind}] ; kind "related" does not order layers.
function layout(nodes, edges, dir, gapMain, gapCross) {
  const ids = nodes.map(n => n.id), idx = Object.fromEntries(ids.map((id, i) => [id, i]));
  const E = edges.filter(e => e.from in idx && e.to in idx && e.from !== e.to);
  const ordering = E.filter(e => e.kind !== "related");
  // break cycles: DFS, drop back edges
  const out = ids.map(() => []);
  ordering.forEach(e => out[idx[e.from]].push(idx[e.to]));
  const state = ids.map(() => 0), dag = ids.map(() => []);
  const visit = u => { state[u] = 1; for (const v of out[u]) { if (state[v] === 1) continue; dag[u].push(v); if (!state[v]) visit(v); } state[u] = 2; };
  ids.forEach((_, i) => { if (!state[i]) visit(i); });
  // longest path layering
  const layer = ids.map(() => 0), indeg = ids.map(() => 0);
  dag.forEach(vs => vs.forEach(v => indeg[v]++));
  const q = ids.map((_, i) => i).filter(i => !indeg[i]);
  while (q.length) { const u = q.shift(); for (const v of dag[u]) { layer[v] = Math.max(layer[v], layer[u] + 1); if (!--indeg[v]) q.push(v); } }
  // isolated nodes connected only by "related": keep next to their partner
  E.filter(e => e.kind === "related").forEach(e => {
    const a = idx[e.from], b = idx[e.to];
    const free = i => !dag[i].length && !dag.some(vs => vs.includes(i));
    if (free(b) && !free(a)) layer[b] = layer[a]; else if (free(a) && !free(b)) layer[a] = layer[b];
  });
  const L = Math.max(0, ...layer) + 1;
  let rows = Array.from({length: L}, () => []);
  ids.forEach((_, i) => rows[layer[i]].push(i));
  // if everything sits in one layer and there are many nodes, wrap into a grid
  const nbr = ids.map(() => []);
  E.forEach(e => { nbr[idx[e.from]].push(idx[e.to]); nbr[idx[e.to]].push(idx[e.from]); });
  // barycenter sweeps
  const pos = ids.map(() => 0);
  const setPos = () => rows.forEach(r => r.forEach((n, k) => pos[n] = k));
  setPos();
  for (let it = 0; it < 6; it++) {
    const range = it % 2 ? [...rows.keys()].reverse() : [...rows.keys()];
    for (const li of range) {
      const bc = n => { const ns = nbr[n].filter(m => layer[m] !== li); return ns.length ? ns.reduce((s, m) => s + pos[m], 0) / ns.length : pos[n]; };
      rows[li].sort((a, b) => bc(a) - bc(b));
      setPos();
    }
  }
  // coordinates
  const main = dir === "LR" ? "w" : "h", cross = dir === "LR" ? "h" : "w";
  const sizes = nodes;
  const layerMain = rows.map(r => Math.max(0, ...r.map(n => sizes[n][main])));
  const layerCross = rows.map(r => r.reduce((s, n) => s + sizes[n][cross], 0) + gapCross * Math.max(0, r.length - 1));
  const maxCross = Math.max(0, ...layerCross);
  const P = {};
  let m = 0;
  rows.forEach((r, li) => {
    let c = (maxCross - layerCross[li]) / 2;
    r.forEach(n => {
      const s = sizes[n];
      const mainOff = m + (layerMain[li] - s[main]) / 2;
      P[ids[n]] = dir === "LR" ? {x: mainOff, y: c, w: s.w, h: s.h, layer: li} : {x: c, y: mainOff, w: s.w, h: s.h, layer: li};
      c += s[cross] + gapCross;
    });
    m += layerMain[li] + gapMain;
  });
  const width = dir === "LR" ? m - gapMain : maxCross, height = dir === "LR" ? maxCross : m - gapMain;
  return {P, width: Math.max(width, 0), height: Math.max(height, 0), edges: E};
}

function edgePath(a, b, dir, kind) {
  // returns [path d, label point]
  if (dir === "LR") {
    if (b.layer > a.layer) {
      const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x - 2, y2 = b.y + b.h / 2, dx = Math.max(40, (x2 - x1) / 2);
      return [`M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`, [(x1 + x2) / 2, (y1 + y2) / 2]];
    }
    if (b.layer < a.layer) {
      const x1 = a.x, y1 = a.y + a.h / 2, x2 = b.x + b.w + 2, y2 = b.y + b.h / 2, dx = Math.max(40, (x1 - x2) / 2);
      return [`M${x1},${y1} C${x1 - dx},${y1} ${x2 + dx},${y2} ${x2},${y2}`, [(x1 + x2) / 2, (y1 + y2) / 2]];
    }
    const top = a.y < b.y ? a : b, bot = a.y < b.y ? b : a;
    const x = top.x + top.w / 2, y1 = top.y + top.h, y2 = bot.y - 2;
    const d = a === top ? `M${x},${y1} L${x},${y2}` : `M${x},${y2} L${x},${y1 + 2}`;
    return [d, [x + 8, (y1 + y2) / 2]];
  }
  // TB
  if (b.layer > a.layer) {
    const x1 = a.x + a.w / 2, y1 = a.y + a.h, x2 = b.x + b.w / 2, y2 = b.y - 2, dy = Math.max(24, (y2 - y1) / 2);
    return [`M${x1},${y1} C${x1},${y1 + dy} ${x2},${y2 - dy} ${x2},${y2}`, [(x1 + x2) / 2, (y1 + y2) / 2]];
  }
  // back edge / loop: route along the right side
  const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x + b.w + 2, y2 = b.y + b.h / 2, bulge = Math.max(x1, x2) + 46;
  return [`M${x1},${y1} C${bulge},${y1} ${bulge},${y2} ${x2},${y2}`, [bulge - 8, (y1 + y2) / 2]];
}

function drawGraph(host, items, edges, dir, opts) {
  host.innerHTML = "";
  const els = items.map(it => { const el = it.el; host.appendChild(el); return el; });
  const sizes = els.map((el, i) => ({id: items[i].id, w: el.offsetWidth, h: el.offsetHeight}));
  const g = layout(sizes, edges, dir, opts.gapMain, opts.gapCross);
  const pad = opts.pad || 0;
  els.forEach((el, i) => { const p = g.P[items[i].id]; el.style.left = (p.x + pad) + "px"; el.style.top = (p.y + pad) + "px"; });
  const W = g.width + pad * 2 + (dir === "TB" ? 60 : 0), H = g.height + pad * 2;
  host.style.width = W + "px"; host.style.height = H + "px";
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  let s = "";
  for (const e of g.edges) {
    const a = {...g.P[e.from]}, b = {...g.P[e.to]};
    a.x += pad; a.y += pad; b.x += pad; b.y += pad;
    const [d, lp] = edgePath(a, b, dir, e.kind);
    const kind = e.kind === "related" ? "related" : e.kind === "blocks" ? "blocks" : "";
    const mk = kind === "related" ? "" : ` marker-end="url(#${kind === "blocks" ? "arrow-bad" : "arrow"})"`;
    s += `<path class="edge ${kind}" d="${d}"${mk}/>`;
    if (e.label) s += `<text class="edge-label" x="${lp[0]}" y="${lp[1] - 9}" text-anchor="middle">${esc(e.label)}</text>`;
  }
  svg.innerHTML = s;
  host.prepend(svg);
}

// ── overview ──────────────────────────────────────────
const all = (k) => tasks.flatMap(t => arr(t[k]).map((x, i) => ({t, x, i})));
const approvals = all("approvals"), actions = all("actions");

document.title = meta.title || "Structured report";
document.getElementById("title").textContent = meta.title || "Report";
const metaBits = [];
if (meta.period) metaBits.push(`<span>${icon("calendar", "sm")}${esc([meta.period.from, meta.period.to].filter(Boolean).join(" – "))}</span>`);
if (meta.author) metaBits.push(`<span>${icon("author", "sm")}${esc(meta.author)}</span>`);
if (meta.audience) metaBits.push(`<span>${icon("chat", "sm")}${esc(meta.audience)}</span>`);
document.getElementById("meta").innerHTML = metaBits.join("");
document.getElementById("summary").innerHTML = md(DATA.summary || "");
const doneN = tasks.filter(t => t.status === "done").length;
document.getElementById("tally").innerHTML =
  `<div><b>${tasks.length}</b><span>${esc(T.tasks)}</span></div>` +
  `<div><b>${doneN}</b><span>${esc(T.status.done)}</span></div>` +
  `<div><b>${approvals.length}</b><span>${esc(T.approvals)}</span></div>` +
  `<div><b>${actions.length}</b><span>${esc(T.actions)}</span></div>`;

const qItems = [...approvals.map(a => ({...a, kind: "approve"})), ...actions.map(a => ({...a, kind: "action"}))];
document.getElementById("queue").innerHTML =
  `<h2 id="queue-h">${icon("queue")}${esc(T.queue)}</h2><p class="hint">${esc(T.queueHint)}</p>` +
  (qItems.length ? `<ul>${qItems.map(q => `<li><button data-task="${esc(q.t.id)}" data-sec="${q.kind === "approve" ? "approvals" : "actions"}">${icon(q.kind)}<span><span class="q-text">${md(q.x.text)}</span><span class="q-task">${esc(q.t.title)}</span></span></button></li>`).join("")}</ul>`
    : `<p class="empty">${esc(T.queueEmpty)}</p>`);

document.getElementById("map-h").textContent = T.map;
document.getElementById("legend").innerHTML =
  `<span><svg viewBox="0 0 34 10"><path d="M1 5h30" stroke="#4A5A60" stroke-width="1.5" marker-end="url(#arrow)"/></svg>${esc(T.depends)}</span>` +
  `<span><svg viewBox="0 0 34 10"><path d="M1 5h32" stroke="#77878C" stroke-width="1.5" stroke-dasharray="5 5"/></svg>${esc(T.related)}</span>` +
  (arr(DATA.links).some(l => l.kind === "blocks") ? `<span><svg viewBox="0 0 34 10"><path d="M1 5h30" stroke="#B8432F" stroke-width="1.5" marker-end="url(#arrow-bad)"/></svg>${esc(T.blocks)}</span>` : "") +
  `<button class="iconbtn no-print" id="print-btn" title="${esc(T.print)}" aria-label="${esc(T.print)}">${icon("print")}</button>`;

function nodeEl(t) {
  const b = document.createElement("button");
  b.className = "node"; b.type = "button"; b.dataset.task = t.id;
  const na = arr(t.approvals).length, nc = arr(t.actions).length;
  b.innerHTML = `<div class="st">${statusBadge(t.status)}</div><h3>${esc(t.title)}</h3>` +
    (t.goal ? `<p class="goal">${esc(String(t.goal).replace(/[`*]/g, ""))}</p>` : "") +
    `<div class="flags">${na ? `<span class="flag mine">${icon("approve", "sm")}${esc(T.approvalsN(na))}</span>` : ""}${nc ? `<span class="flag mine">${icon("action", "sm")}${esc(T.actionsN(nc))}</span>` : ""}` +
    `${arr(t.stages).length ? `<span class="flag">${icon("flow", "sm")}${esc(T.stepsN(arr(t.stages).length))}</span>` : ""}${arr(t.context).length ? `<span class="flag">${icon("context", "sm")}${esc(T.sourcesN(arr(t.context).length))}</span>` : ""}</div>`;
  return b;
}
// "A depends on B" is drawn B → A (prerequisite first)
const mapEdges = arr(DATA.links).map(l => l.kind === "depends" ? {from: l.to, to: l.from, kind: "depends", label: l.label} : {from: l.from, to: l.to, kind: l.kind || "related", label: l.label});
function drawMap() {
  const labelled = mapEdges.some(e => e.label);
  drawGraph(document.getElementById("graph"), tasks.map(t => ({id: t.id, el: nodeEl(t)})), mapEdges, "LR", {gapMain: labelled ? 150 : 96, gapCross: 44, pad: 8});
}
drawMap();
document.getElementById("footer").textContent = `${T.generated}: ${meta.generated || new Date().toISOString().slice(0, 16).replace("T", " ")}`;

// ── task report ───────────────────────────────────────
function section(id, iconId, title, body, count) {
  return `<section class="sec" id="sec-${id}"><h3>${icon(iconId)}${esc(title)}${count != null ? `<span class="count">${count}</span>` : ""}</h3>${body}</section>`;
}
const noneP = () => `<p class="none">${esc(T.none)}</p>`;

function taskHTML(t, forPrint) {
  const ctx = arr(t.context);
  const ctxIds = new Set(ctx.map(c => c.id));
  const refChips = ids => arr(ids).filter(id => ctxIds.has(id)).map(id => {
    const c = ctx.find(x => x.id === id);
    return `<a class="chip" href="#ctx-${esc(t.id)}-${esc(id)}" data-ctx="${esc(id)}" title="${esc(c.title)}">${ico(c.kind, "doc", "sm")}${esc(id)}</a>`;
  }).join("");

  let h = "";
  h += section("problem", "problem", T.problem, `<div class="prose lead">${md(t.problem || "")}</div>`);
  h += section("goal", "goal", T.goal, `<div class="prose">${md(t.goal || "")}</div>`);

  const legend = `<div class="kind-legend"><span><i class="k-evidence"></i>${esc(T.evidence)}</span><span><i class="k-inference"></i>${esc(T.inference)}</span><span><i class="k-assumption"></i>${esc(T.assumption)}</span></div>`;
  h += section("context", "context", T.context, ctx.length ? legend + `<ul class="ctx">${ctx.map(c => {
    const url = safeUrl(c.url);
    const title = url ? `<a class="t" href="${esc(url)}" target="_blank" rel="noopener">${esc(c.title)}</a>` : `<span class="t">${esc(c.title)}</span>`;
    return `<li id="ctx-${esc(t.id)}-${esc(c.id)}" class="k-evidence">${ico(c.kind, "doc")}<div>${title}<span class="id">${esc(c.id)}</span>${c.note ? `<div class="n">${md(c.note)}</div>` : ""}</div></li>`;
  }).join("")}</ul>` : noneP(), ctx.length);

  const inf = arr(t.inferences);
  h += section("inferences", "inference", T.inferences, inf.length ? `<ul class="claims">${inf.map(x => `<li class="k-inference"><div>${md(x.text)}</div><div class="sub">${arr(x.basis).length ? `<span>${esc(T.basis)}: ${refChips(x.basis)}</span>` : ""}${conf(x.confidence)}</div></li>`).join("")}</ul>` : noneP(), inf.length);

  const asm = arr(t.assumptions);
  h += section("assumptions", "assumption", T.assumptions, asm.length ? `<ul class="claims">${asm.map(x => `<li class="k-assumption"><div>${md(x.text)}</div><div class="sub">${x.why ? `<span>${esc(T.why)}: ${md(x.why)}</span>` : ""}${x.verify ? `<span>${esc(T.verify)}: ${md(x.verify)}</span>` : ""}${x.risk ? `<span>${esc(T.risk)}: ${esc(T[x.risk] || x.risk)}</span>` : ""}</div></li>`).join("")}</ul>` : noneP(), asm.length);

  const res = t.result || {};
  const items = arr(res.items);
  h += section("result", "result", T.result, (res.summary ? `<p class="result-sum">${md(res.summary)}</p>` : "") + (items.length ? `<ul class="result">${items.map(r => {
    const body = r.kind === "metric" && r.value != null
      ? `<span class="metric"><b>${esc(r.value)}</b><span>${md(r.text || "")}</span></span>` : md(r.text || "");
    return `<li>${ico(r.kind, "changed")}<span class="k">${esc(T.kinds[r.kind] || r.kind || "")}</span><div>${body}${r.ref ? ` ${link(r.ref, "chip")}` : ""}</div></li>`;
  }).join("")}</ul>` : (res.summary ? "" : noneP())));

  const st = arr(t.stages);
  if (forPrint) {
    h += section("flow", "flow", T.flow, st.length ? `<ol>${st.map(s => `<li><strong>${esc(s.title)}</strong> — ${md(s.detail || "")}${s.outcome ? `<br><em>${esc(T.outcome)}:</em> ${md(s.outcome)}` : ""}</li>`).join("")}</ol>` : noneP(), st.length);
  } else {
    h += section("flow", "flow", T.flow, st.length ? `<div class="flow"><div class="graph" id="flow-graph"></div></div>` : noneP(), st.length);
  }

  const ap = arr(t.approvals);
  h += section("approvals", "approve", T.approvals, ap.length ? `<ul class="mine-list">${ap.map(a => `<li>${icon("approve")}<div><div class="t">${md(a.text)}</div>${a.why ? `<div class="why">${md(a.why)}</div>` : ""}${arr(a.options).length ? `<div class="opts">${arr(a.options).map(o => `<span>${esc(o)}</span>`).join("")}</div>` : ""}</div></li>`).join("")}</ul>` : noneP(), ap.length);

  const ac = arr(t.actions);
  h += section("actions", "action", T.actions, ac.length ? `<ul class="mine-list">${ac.map(a => `<li>${icon("action")}<div><div class="t">${md(a.text)}</div>${a.why ? `<div class="why">${md(a.why)}</div>` : ""}${a.command ? `<div class="cmd"><code>${esc(a.command)}</code>${forPrint ? "" : `<button class="copy" data-copy="${esc(a.command)}">${icon("copy", "sm")}${esc(T.copy)}</button>`}</div>` : ""}</div></li>`).join("")}</ul>` : noneP(), ac.length);
  return h;
}

function headHTML(t, withNav) {
  const i = tasks.indexOf(t);
  return `<div><div class="st">${statusBadge(t.status)}${t.ref ? `<span>${link(t.ref)}</span>` : ""}${arr(t.tags).map(x => `<span class="chip">${esc(x)}</span>`).join("")}</div><h2 id="d-title">${esc(t.title)}</h2></div>` +
    (withNav ? `<div class="d-nav"><button class="iconbtn" data-nav="${i - 1}" ${i ? "" : "disabled"} title="${esc(T.prev)}" aria-label="${esc(T.prev)}">${icon("prev")}</button><button class="iconbtn" data-nav="${i + 1}" ${i < tasks.length - 1 ? "" : "disabled"} title="${esc(T.next)}" aria-label="${esc(T.next)}">${icon("next")}</button><button class="iconbtn" data-close title="${esc(T.close)}" aria-label="${esc(T.close)}">${icon("close")}</button></div>` : "");
}

function stageEl(s, n, t) {
  const el = document.createElement("div");
  el.className = `stage st-${s.status || "done"}`;
  const ctxIds = new Set(arr(t.context).map(c => c.id));
  const refs = arr(s.uses).filter(id => ctxIds.has(id));
  el.innerHTML = `<div class="h"><span class="num">${n}</span><h4>${esc(s.title)}</h4><span class="s-${esc(s.status || "done")}" title="${esc(T.status[s.status || "done"] || "")}">${ico(s.status || "done", "done", "sm")}</span></div>` +
    (s.detail ? `<div class="d">${md(s.detail)}</div>` : "") +
    (s.outcome ? `<div class="o">${icon("outcome", "sm")}<span>${md(s.outcome)}</span></div>` : "") +
    (refs.length ? `<div class="refs">${refs.map(id => `<a class="chip" href="#ctx-${esc(t.id)}-${esc(id)}" data-ctx="${esc(id)}">${ico((arr(t.context).find(c => c.id === id) || {}).kind, "doc", "sm")}${esc(id)}</a>`).join("")}</div>` : "");
  return el;
}

const drawer = document.getElementById("drawer"), scrim = document.getElementById("scrim");
let current = null, lastFocus = null;
function openTask(id, sec) {
  const t = byId[id]; if (!t) return;
  if (!current) lastFocus = document.activeElement;
  current = id;
  drawer.innerHTML = `<div class="d-head">${headHTML(t, true)}</div><div class="d-body">${taskHTML(t, false)}</div>`;
  drawer.classList.add("open"); scrim.classList.add("open");
  document.querySelectorAll(".node").forEach(n => n.setAttribute("aria-current", n.dataset.task === id ? "true" : "false"));
  const st = arr(t.stages);
  if (st.length) {
    const flow = arr(t.flow).length ? arr(t.flow) : st.slice(1).map((s, k) => ({from: st[k].id, to: s.id}));
    drawGraph(document.getElementById("flow-graph"), st.map((s, k) => ({id: s.id, el: stageEl(s, k + 1, t)})), flow.map(f => ({...f, kind: "depends"})), "TB", {gapMain: 46, gapCross: 28, pad: 6});
  }
  if (location.hash !== "#task=" + id) history.replaceState(null, "", "#task=" + encodeURIComponent(id));
  if (sec) { const s = drawer.querySelector("#sec-" + sec); if (s) s.scrollIntoView({block: "start"}); }
  else drawer.scrollTop = 0;
  drawer.focus({preventScroll: true});
}
function closeTask() {
  if (!current) return;
  drawer.classList.remove("open"); scrim.classList.remove("open");
  document.querySelectorAll(".node").forEach(n => n.setAttribute("aria-current", "false"));
  current = null;
  history.replaceState(null, "", location.pathname + location.search);
  if (lastFocus) lastFocus.focus();
}

document.addEventListener("click", e => {
  const node = e.target.closest("[data-task]");
  if (node) { openTask(node.dataset.task, node.dataset.sec); return; }
  if (e.target.closest("[data-close]") || e.target === scrim) { closeTask(); return; }
  const nav = e.target.closest("[data-nav]");
  if (nav && tasks[+nav.dataset.nav]) { openTask(tasks[+nav.dataset.nav].id); return; }
  const cp = e.target.closest("[data-copy]");
  if (cp) { navigator.clipboard?.writeText(cp.dataset.copy).then(() => { cp.lastChild.textContent = T.copied; setTimeout(() => cp.lastChild.textContent = T.copy, 1400); }); return; }
  const chip = e.target.closest("a[data-ctx]");
  if (chip && current) { e.preventDefault(); const el = drawer.querySelector(chip.getAttribute("href")); if (el) { drawer.querySelectorAll(".ctx li").forEach(li => li.style.background = ""); el.scrollIntoView({block: "center", behavior: "smooth"}); el.style.background = "var(--marker-soft)"; } }
  if (e.target.closest("#print-btn")) window.print();
});
document.addEventListener("keydown", e => {
  if (!current) return;
  if (e.key === "Escape") closeTask();
  if (e.target.closest && e.target.closest("input,textarea")) return;
  const i = tasks.findIndex(t => t.id === current);
  if (e.key === "ArrowRight" && e.altKey && tasks[i + 1]) openTask(tasks[i + 1].id);
  if (e.key === "ArrowLeft" && e.altKey && tasks[i - 1]) openTask(tasks[i - 1].id);
});
window.addEventListener("beforeprint", () => {
  document.getElementById("print-all").innerHTML = tasks.map(t => `<article class="task-print"><div class="d-head">${headHTML(t, false)}</div><div class="d-body">${taskHTML(t, true)}</div></article>`).join("");
});
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(drawMap, 150); });
const m = /^#task=(.+)$/.exec(location.hash);
if (m) openTask(decodeURIComponent(m[1]));
})();
</script>
